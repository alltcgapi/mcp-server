name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 20 is the minimum declared in `engines`; 22 and 24 are what people install today.
        node: ['20', '22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The suite also checks that package.json, server.json, mcp.json and the two plugin manifests
      # carry the same version and the same tool list.
      - run: npm test
      # Prints what would land on the registry: the one check that notices a missing `dist/` or a
      # file that should not ship.
      - run: npm pack --dry-run
